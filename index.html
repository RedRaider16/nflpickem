<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Pick 'Em 2026 — Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #080C18;
    --bg-2: #0F172E;
    --surface: #141D38;
    --surface-alt: #1A2444;
    --surface-hover: #202C52;
    --line: #2A3658;
    --ink: #F2EFE6;
    --ink-dim: #8D96B3;
    --gold: #D4AF37;
    --gold-bright: #F0CC5C;
    --gold-deep: #9C7A22;
    --maroon: #8C1D2B;
    --maroon-bright: #E0616D;
    --silver: #C7CCD8;
    --bronze: #B87A4A;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    background:
      radial-gradient(ellipse 1000px 600px at 50% -15%, rgba(212,175,55,0.14), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 30%, rgba(140,29,43,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .top-accent {
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--maroon), var(--gold), transparent);
    background-size: 200% 100%;
    animation: shimmerLine 6s linear infinite;
  }

  @keyframes shimmerLine {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .wrap {
    max-width: 1020px;
    margin: 0 auto;
    padding: 28px 16px 90px;
  }

  .header-banner {
    text-align: center;
    margin: 0 -16px 8px;
    position: relative;
  }

  .header-banner::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 60%;
    background: radial-gradient(ellipse, rgba(212,175,55,0.25), transparent 70%);
    filter: blur(30px);
    animation: pulseGlow 4s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .header-banner img {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    display: block;
    margin: 0 auto;
    border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.55);
  }

  .star-divider {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 30px;
    opacity: 0.85;
  }

  .star-divider svg { width: 12px; height: 12px; }
  .star-divider svg:nth-child(3) { width: 18px; height: 18px; }

  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-dim);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 0 0 rgba(240,204,92,0.6);
    animation: livePulse 2s ease-out infinite;
  }

  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(240,204,92,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(240,204,92,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,204,92,0); }
  }

  .callout-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 28px;
  }

  @media (max-width: 640px) {
    .callout-row { grid-template-columns: 1fr; }
  }

  .card {
    background: linear-gradient(155deg, var(--surface) 0%, var(--surface-alt) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }

  .card.leader {
    border-left: 4px solid var(--gold);
    margin-bottom: 20px;
    display: none;
    box-shadow: 0 4px 24px rgba(212,175,55,0.15), 0 4px 18px rgba(0,0,0,0.3);
  }

  .eyebrow {
    color: var(--ink-dim);
    font-size: 0.78rem;
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .eyebrow svg { width: 14px; height: 14px; flex-shrink: 0; }

  .leader-name {
    font-size: 2rem;
    margin: 0;
    background: linear-gradient(90deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .leader-points { color: var(--gold); font-size: 1.9rem; font-family: 'Oswald', sans-serif; font-weight: 700; }
  .pot-note { color: var(--ink-dim); margin-top: 8px; font-size: 0.9rem; }

  .callout-value { font-size: 1.3rem; margin: 2px 0 4px; font-family: 'Oswald', sans-serif; font-weight: 600; }
  .callout-sub { color: var(--ink-dim); font-size: 0.88rem; }
  .callout-value.gold { color: var(--gold-bright); }
  .callout-value.maroon { color: var(--maroon-bright); }

  section { margin-bottom: 44px; }

  section > h2 {
    font-size: 1.15rem;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  section > h2 svg { width: 20px; height: 20px; color: var(--gold); flex-shrink: 0; }
  section > h2 .bar { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }

  .std-table { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .std-table th, .std-table td { text-align: left; padding: 11px 14px; }
  .std-table tbody tr { transition: background 0.15s ease, transform 0.15s ease; }
  .std-table tbody tr:nth-child(odd) td { background: var(--surface); }
  .std-table tbody tr:nth-child(even) td { background: var(--surface-alt); }
  .std-table tbody tr:hover td { background: var(--surface-hover); }
  .std-table th {
    color: var(--ink-dim);
    font-weight: 600;
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--bg-2);
    padding: 12px 14px;
  }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 0.78rem;
    font-family: 'Oswald', sans-serif;
  }
  .rank-badge.gold { background: linear-gradient(155deg, var(--gold-bright), var(--gold-deep)); color: #201400; }
  .rank-badge.silver { background: linear-gradient(155deg, #E4E8F0, var(--silver)); color: #202430; }
  .rank-badge.bronze { background: linear-gradient(155deg, #D89A6A, var(--bronze)); color: #2A1608; }
  .rank-badge.plain { background: var(--bg-2); color: var(--ink-dim); border: 1px solid var(--line); }

  .name-cell.rank-1 { color: var(--gold-bright); font-weight: 700; }

  .grid-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  #grid-table { min-width: 720px; }
  #grid-table th, #grid-table td {
    padding: 9px 12px;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  #grid-table tbody tr { transition: background 0.15s ease; }
  #grid-table tbody tr:hover td { background: var(--surface-hover); }
  #grid-table thead th {
    background: var(--bg-2);
    color: var(--ink-dim);
    font-weight: 600;
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    position: sticky;
    top: 0;
  }
  #grid-table td:first-child, #grid-table th:first-child {
    position: sticky;
    left: 0;
    background: var(--surface);
    font-weight: 600;
    z-index: 1;
  }

  .picks-cards { display: none; }
  .pick-card {
    background: linear-gradient(155deg, var(--surface) 0%, var(--surface-alt) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pick-card:active { transform: scale(0.99); }
  .pick-card .name { font-size: 1.08rem; margin: 0 0 2px; font-family: 'Oswald', sans-serif; font-weight: 600; }
  .pick-card .total { color: var(--gold-bright); font-size: 0.9rem; margin-bottom: 10px; font-weight: 600; }
  .pick-game {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
  }
  .pick-game:first-of-type { border-top: none; }
  .pick-game .matchup { color: var(--ink-dim); flex: 1; }
  .pick-game .pick-info { text-align: right; }

  @media (max-width: 680px) {
    .grid-scroll { display: none; }
    .picks-cards { display: block; }
  }

  .actual-final { color: var(--ink); }
  .actual-pending { color: var(--ink-dim); font-style: italic; }

  .refresh-note {
    color: var(--ink-dim);
    font-size: 0.85rem;
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }

  .empty-state { color: var(--ink-dim); font-style: italic; padding: 14px; }

  /* Skeleton shimmer for loading rows */
  .skeleton-row td { padding: 12px 14px; }
  .skeleton-bar {
    height: 14px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface-alt) 25%, var(--surface-hover) 50%, var(--surface-alt) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  footer {
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.8rem;
    margin-top: 50px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="top-accent"></div>
<div class="wrap">

  <div class="header-banner">
    <img src="header.png" alt="NFL Pick 'Em 2026 Season Leaderboard">
  </div>

  <div class="star-divider">
    <svg viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6L12 2z"/></svg>
    <svg viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6L12 2z"/></svg>
    <svg viewBox="0 0 24 24" fill="#F0CC5C"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6L12 2z"/></svg>
    <svg viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6L12 2z"/></svg>
    <svg viewBox="0 0 24 24" fill="#D4AF37"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6L12 2z"/></svg>
  </div>

  <div class="card leader" id="leader-card">
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v3a5 5 0 01-5 5 5 5 0 01-5-5V4z"/><path d="M7 5H4a2 2 0 002 4"/><path d="M17 5h3a2 2 0 01-2 4"/><path d="M12 12v4"/><path d="M9 20h6"/><path d="M10 16h4v4h-4z"/></svg>
      Current leader — this week
    </p>
    <h1 class="leader-name" id="leader-name"></h1>
    <div class="leader-points" id="leader-points"></div>
    <p class="pot-note" id="pot-note"></p>
  </div>

  <div class="callout-row">
    <div class="card" style="border-left: 3px solid var(--gold);">
      <p class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        Closest predictor
      </p>
      <div class="callout-value gold" id="closest-name">—</div>
      <div class="callout-sub" id="closest-sub"></div>
    </div>
    <div class="card" style="border-left: 3px solid var(--maroon);">
      <p class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        Biggest upset call
      </p>
      <div class="callout-value maroon" id="upset-name">—</div>
      <div class="callout-sub" id="upset-sub"></div>
    </div>
  </div>

  <section>
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v3a5 5 0 01-5 5 5 5 0 01-5-5V4z"/><path d="M7 5H4a2 2 0 002 4"/><path d="M17 5h3a2 2 0 01-2 4"/><path d="M12 12v4"/><path d="M9 20h6"/><path d="M10 16h4v4h-4z"/></svg>
      This week's standings
      <span class="bar"></span>
    </h2>
    <table class="std-table" id="standings-table">
      <thead><tr><th>Rank</th><th>Name</th><th>Points</th><th>W-L</th></tr></thead>
      <tbody id="standings-body"></tbody>
    </table>
  </section>

  <section>
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
      Season standings
      <span class="bar"></span>
    </h2>
    <p class="callout-sub" id="bonus-pool-note" style="margin-bottom:12px;"></p>
    <table class="std-table" id="season-table">
      <thead><tr><th>Rank</th><th>Name</th><th>Points</th><th>W-L</th><th>Weeks</th><th>Bonus</th></tr></thead>
      <tbody id="season-body"></tbody>
    </table>
  </section>

  <section>
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="6.5"/><path d="M8 9.5l1.2 1.2M8 14.5l1.2-1.2M16 9.5l-1.2 1.2M16 14.5l-1.2-1.2"/><path d="M9 12h6"/></svg>
      Everyone's picks
      <span class="bar"></span>
    </h2>
    <div class="grid-scroll">
      <table id="grid-table">
        <thead id="grid-head"></thead>
        <tbody id="grid-body"></tbody>
      </table>
    </div>
    <div class="picks-cards" id="picks-cards"></div>
    <p class="refresh-note"><span class="live-indicator"><span class="live-dot"></span>Live — updates every 60 seconds</span></p>
  </section>

  <footer>NFL Pick 'Em 2026</footer>

</div>

<script>
  const STANDINGS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS5I8q8HKZ2nA3UFV8Xd7wcBdkjYvvjXXJbWYvWd0KJM8VUZ1Kh4A4gqZDl9uGxCZ0IN56H00PhunP/pub?gid=377914368&single=true&output=csv';
  const PICKS_GRID_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS5I8q8HKZ2nA3UFV8Xd7wcBdkjYvvjXXJbWYvWd0KJM8VUZ1Kh4A4gqZDl9uGxCZ0IN56H00PhunP/pub?gid=123174537&single=true&output=csv';
  const SEASON_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS5I8q8HKZ2nA3UFV8Xd7wcBdkjYvvjXXJbWYvWd0KJM8VUZ1Kh4A4gqZDl9uGxCZ0IN56H00PhunP/pub?gid=1373114026&single=true&output=csv';
  const INSIGHTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTS5I8q8HKZ2nA3UFV8Xd7wcBdkjYvvjXXJbWYvWd0KJM8VUZ1Kh4A4gqZDl9uGxCZ0IN56H00PhunP/pub?gid=524816719&single=true&output=csv';

  function parseCsv(text) {
    return text.trim().split('\n').map(function (line) {
      const cells = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { cells.push(cur); cur = ''; }
        else { cur += ch; }
      }
      cells.push(cur);
      return cells.map(function (c) { return c.replace(/^"|"$/g, '').trim(); });
    });
  }

  async function fetchCsv(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('Fetch failed: ' + res.status);
    const text = await res.text();
    if (text.trim().startsWith('<')) throw new Error('Got HTML instead of CSV — check the published link');
    return parseCsv(text);
  }

  function skeletonRows(tbodyId, cols, count) {
    const tbody = document.getElementById(tbodyId);
    let html = '';
    for (let i = 0; i < count; i++) {
      html += '<tr class="skeleton-row">';
      for (let c = 0; c < cols; c++) html += '<td><div class="skeleton-bar" style="width:' + (40 + Math.random() * 50) + '%"></div></td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function rankBadge(rank) {
    const n = Number(rank);
    const cls = n === 1 ? 'gold' : n === 2 ? 'silver' : n === 3 ? 'bronze' : 'plain';
    return '<span class="rank-badge ' + cls + '">' + rank + '</span>';
  }

  function renderStandingsTable(tbodyId, rows, includeLeader) {
    const tbody = document.getElementById(tbodyId);
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No entries yet.</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    rows.forEach(function (r) {
      const tr = document.createElement('tr');
      const wl = (r[3] || '0') + '-' + (r[4] || '0');
      const nameClass = r[0] === '1' ? 'name-cell rank-1' : 'name-cell';
      tr.innerHTML = '<td>' + rankBadge(r[0]) + '</td><td class="' + nameClass + '">' + r[1] + '</td><td>' + r[2] + '</td><td>' + wl + '</td>';
      tbody.appendChild(tr);
    });

    if (includeLeader && rows.length) {
      document.getElementById('leader-name').textContent = rows[0][1];
      document.getElementById('leader-points').textContent = rows[0][2] + ' pts';
      document.getElementById('leader-card').style.display = 'block';
    }
  }

  async function loadStandings() {
    try {
      const rows = await fetchCsv(STANDINGS_CSV_URL);
      const header = rows[0];
      const potNote = header[5] || '';
      const splitNote = header[6] || '';
      const body = rows.slice(1).filter(function (r) { return r[1]; });

      document.getElementById('pot-note').textContent = [potNote, splitNote].filter(Boolean).join(' — ');
      renderStandingsTable('standings-body', body, true);
    } catch (e) {
      document.getElementById('standings-body').innerHTML =
        '<tr><td colspan="4" class="empty-state">Couldn\'t load standings yet.</td></tr>';
    }
  }

  function renderSeasonTable(rows) {
    const tbody = document.getElementById('season-body');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No entries yet.</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    rows.forEach(function (r) {
      const tr = document.createElement('tr');
      const wl = (r[3] || '0') + '-' + (r[4] || '0');
      const eligible = r[6] === 'Yes';
      const bonusHtml = eligible
        ? '<span style="color: var(--gold-bright); font-weight:600;">' + r[6] + '</span>'
        : '<span style="color: var(--ink-dim);">' + r[6] + '</span>';
      tr.innerHTML = '<td>' + rankBadge(r[0]) + '</td><td class="name-cell">' + r[1] + '</td><td>' + r[2] + '</td><td>' + wl + '</td><td>' + r[5] + '</td><td>' + bonusHtml + '</td>';
      tbody.appendChild(tr);
    });
  }

  async function loadSeasonStandings() {
    try {
      const rows = await fetchCsv(SEASON_CSV_URL);
      const body = rows.slice(1).filter(function (r) { return r[1]; });
      renderSeasonTable(body);
    } catch (e) {
      document.getElementById('season-body').innerHTML =
        '<tr><td colspan="6" class="empty-state">Couldn\'t load season standings yet.</td></tr>';
    }
  }

  async function loadInsights() {
    try {
      const rows = await fetchCsv(INSIGHTS_CSV_URL);
      const kv = {};
      rows.slice(1).forEach(function (r) { kv[r[0]] = r[1]; });

      document.getElementById('closest-name').textContent = kv.ClosestPredictorNames || '—';
      document.getElementById('closest-sub').textContent =
        (kv.ClosestPredictorPoints && kv.ClosestPredictorPoints !== '') ? (kv.ClosestPredictorPoints + ' / ' + kv.ClosestPredictorMax + ' precision points') : '';

      if (kv.SeasonBonusPool) {
        document.getElementById('bonus-pool-note').textContent =
          'Season bonus pool: $' + kv.SeasonBonusPool + ' — split among the top 3 season scorers who play at least ' +
          kv.BonusEligibleWeeksRequired + ' of ' + kv.TotalSeasonWeeks + ' weeks.';
      }

      if (kv.BiggestUpsetTeam) {
        document.getElementById('upset-name').textContent = kv.BiggestUpsetTeam + ' (' + kv.BiggestUpsetOdds + ')';
        document.getElementById('upset-sub').textContent =
          kv.BiggestUpsetMatchup + ' — called by ' + kv.BiggestUpsetCallers;
      } else {
        document.getElementById('upset-name').textContent = 'None yet';
        document.getElementById('upset-sub').textContent = 'Check back once games go final.';
      }
    } catch (e) {
      document.getElementById('closest-name').textContent = '—';
      document.getElementById('upset-name').textContent = '—';
    }
  }

  async function loadPicksGrid() {
    try {
      const rows = await fetchCsv(PICKS_GRID_CSV_URL);
      const header = rows[0];
      const body = rows.slice(1).filter(function (r) { return r[0]; });

      if (!body.length) {
        document.getElementById('grid-body').innerHTML = '<tr><td class="empty-state">No picks submitted yet.</td></tr>';
        document.getElementById('picks-cards').innerHTML = '<p class="empty-state">No picks submitted yet.</p>';
        return;
      }

      const thead = document.getElementById('grid-head');
      const headRow = document.createElement('tr');
      header.forEach(function (h) {
        const th = document.createElement('th');
        th.textContent = h;
        headRow.appendChild(th);
      });
      thead.innerHTML = '';
      thead.appendChild(headRow);

      const tbody = document.getElementById('grid-body');
      tbody.innerHTML = '';
      body.forEach(function (r) {
        const tr = document.createElement('tr');
        r.forEach(function (cell, i) {
          const td = document.createElement('td');
          td.textContent = cell;
          if (i >= 4 && (i - 2) % 3 === 0) {
            td.classList.add(cell.includes('(') ? 'actual-final' : 'actual-pending');
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      const cardsWrap = document.getElementById('picks-cards');
      cardsWrap.innerHTML = '';
      body.forEach(function (r) {
        const card = document.createElement('div');
        card.className = 'pick-card';
        let html = '<p class="name">' + r[0] + '</p><p class="total">' + r[1] + ' pts</p>';
        for (let i = 2; i < r.length; i += 3) {
          const label = header[i].replace(' — Pick', '');
          const pick = r[i];
          const predicted = r[i + 1];
          const actual = r[i + 2] || '';
          const isFinal = actual.includes('(');
          const actualClass = isFinal ? 'actual-final' : 'actual-pending';
          html += '<div class="pick-game"><span class="matchup">' + label + '</span>' +
            '<span class="pick-info">' + pick + ' (' + predicted + ')<br><span class="' + actualClass + '">' + actual + '</span></span></div>';
        }
        card.innerHTML = html;
        cardsWrap.appendChild(card);
      });
    } catch (e) {
      document.getElementById('grid-body').innerHTML = '<tr><td class="empty-state">Couldn\'t load picks yet.</td></tr>';
      document.getElementById('picks-cards').innerHTML = '<p class="empty-state">Couldn\'t load picks yet.</p>';
    }
  }

  function showSkeletons() {
    skeletonRows('standings-body', 4, 3);
    skeletonRows('season-body', 6, 3);
  }

  function refreshAll() {
    loadStandings();
    loadSeasonStandings();
    loadInsights();
    loadPicksGrid();
  }

  showSkeletons();
  refreshAll();
  setInterval(refreshAll, 60000);
</script>
