<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Pick 'Em 2026 — Live Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #080C18;
    --bg-2: #0F172E;
    --surface: #141D38;
    --surface-alt: #1A2444;
    --surface-hover: #202C52;
    --line: #2A3658;
    --ink: #F2EFE6;
    --ink-dim: #8D96B3;
    --gold: #D4AF37;
    --gold-bright: #F0CC5C;
    --gold-deep: #9C7A22;
    --maroon: #8C1D2B;
    --maroon-bright: #E0616D;
    --silver: #C7CCD8;
    --bronze: #B87A4A;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    background:
      radial-gradient(ellipse 1000px 600px at 50% -15%, rgba(212,175,55,0.14), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 30%, rgba(140,29,43,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .top-accent {
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--maroon), var(--gold), transparent);
    background-size: 200% 100%;
    animation: shimmerLine 6s linear infinite;
  }

  @keyframes shimmerLine {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .wrap {
    max-width: 1020px;
    margin: 0 auto;
    padding: 28px 16px 90px;
  }

  .header-banner {
    text-align: center;
    margin: 0 -16px 8px;
    position: relative;
  }

  .header-banner::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 60%;
    background: radial-gradient(ellipse, rgba(212,175,55,0.25), transparent 70%);
    filter: blur(30px);
    animation: pulseGlow 4s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .header-banner img {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    display: block;
    margin: 0 auto;
    border-radius: 10px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.55);
  }

  .star-divider {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 30px;
    opacity: 0.85;
  }

  .star-divider svg { width: 12px; height: 12px; }
  .star-divider svg:nth-child(3) { width: 18px; height: 18px; }

  .live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-dim);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 0 0 rgba(240,204,92,0.6);
    animation: livePulse 2s ease-out infinite;
  }

  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(240,204,92,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(240,204,92,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,204,92,0); }
  }

  .callout-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 28px;
  }

  @media (max-width: 640px) {
    .callout-row { grid-template-columns: 1fr; }
  }

  .card {
    background: linear-gradient(155deg, var(--surface) 0%, var(--surface-alt) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }

  .card.leader {
    border-left: 4px solid var(--gold);
    margin-bottom: 20px;
    display: none;
    box-shadow: 0 4px 24px rgba(212,175,55,0.15), 0 4px 18px rgba(0,0,0,0.3);
  }

  .eyebrow {
    color: var(--ink-dim);
    font-size: 0.78rem;
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .eyebrow svg { width: 14px; height: 14px; flex-shrink: 0; }

  .leader-name {
    font-size: 2rem;
    margin: 0;
    background: linear-gradient(90deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .leader-points { color: var(--gold); font-size: 1.9rem; font-family: 'Oswald', sans-serif; font-weight: 700; }
  .pot-note { color: var(--ink-dim); margin-top: 8px; font-size: 0.9rem; }

  .callout-value { font-size: 1.3rem; margin: 2px 0 4px; font-family: 'Oswald', sans-serif; font-weight: 600; }
  .callout-sub { color: var(--ink-dim); font-size: 0.88rem; }
  .callout-value.gold { color: var(--gold-bright); }
